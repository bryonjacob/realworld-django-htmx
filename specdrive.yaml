# specdrive.yaml — Gherkin behavioral contract configuration
# Docs: https://github.com/bryonjacob/specdrive

# Local spec directories (relative to project root)
# FFFlow's python convention puts Gherkin specs under docs/specs/.
localSpecs:
  - docs/specs

# Uncomment to install shared spec packages:
# specs:
#   - name: my-shared-spec
#     source: github:org/spec-repo@v1.0

# Every scenario is traced to a test that exercises it (131/131). Fail the
# build on any untraced test or uncovered RID.
strictTraceability: true
